name: PR validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check             -r backend/requirements-dev.txt             pytest

      - name: Compile backend Python
        run: python -m compileall -q backend/function backend/bin

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build development artifact
        working-directory: frontend
        env:
          VITE_APP_STAGE: dev
          VITE_API_ENDPOINT: http://localhost:3000
          VITE_COGNITO_ENABLED: "false"
          VITE_COGNITO_DOMAIN: http://localhost:3001
          VITE_COGNITO_CLIENT_ID: ci-client
          VITE_COGNITO_REDIRECT_URI: http://localhost:5173/callback
          VITE_COGNITO_LOGOUT_URI: http://localhost:5173
        run: npm run build:dev

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate executable shell scripts
        run: |
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(
            git grep -Il -E '^#!.*(bash|sh)([[:space:]]|$)' -- backend/bin
          )

          if (( ${#scripts[@]} == 0 )); then
            echo "No backend shell scripts were discovered." >&2
            exit 1
          fi

          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

          echo "Validated ${#scripts[@]} shell scripts."

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend lockfile
        working-directory: frontend
        run: npm audit --audit-level=high
