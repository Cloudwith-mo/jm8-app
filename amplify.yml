version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run test
            - npm run build:staging
      artifacts:
        baseDirectory: frontend/dist
        files:
          - '**/*'
      cache:
        paths:
          - frontend/node_modules/**/*
          - ~/.npm/**/*

# Required Amplify SPA rewrite for the staging frontend.
# source: /<*>
# target: /index.html
# status: 200
# rewrite
#
# Staging should use Amplify basic authentication until public beta.
# Store credentials only in Amplify branch settings, not in git.